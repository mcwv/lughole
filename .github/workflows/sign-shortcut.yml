name: Validate Apple Shortcut (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [feature/instagram-shortcut-builder]
    paths:
      - 'shortcut-builder/unsigned/*.shortcut'
      - '.github/workflows/sign-shortcut.yml'
jobs:
  validate:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate unsigned shortcut format
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(shortcut-builder/unsigned/*.shortcut)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No unsigned shortcut files found"
            exit 1
          fi
          for input in "${files[@]}"; do
            echo "::group::Validate $(basename "$input")"
            file "$input"
            plutil -lint "$input"
            python3 - "$input" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              workflow = plistlib.load(f)
          actions = workflow.get("WFWorkflowActions")
          if not isinstance(actions, list) or not actions:
              raise SystemExit("Shortcut must contain at least one action")
          for action in actions:
              if not isinstance(action, dict) or not action.get("WFWorkflowActionIdentifier"):
                  raise SystemExit("Shortcut action is missing an identifier")
          print(f"Valid plist structure, {len(actions)} action(s)")
          PY
            echo "::endgroup::"
          done
      - name: Upload explicitly unsigned test file
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-shortcut-format-smoke-test
          path: shortcut-builder/unsigned/*.shortcut
          if-no-files-found: error
