name: Sign Apple Shortcut
on:
  workflow_dispatch:
  push:
    branches: [feature/instagram-shortcut-builder]
    paths:
      - 'shortcut-builder/unsigned/*.shortcut'
      - '.github/workflows/sign-shortcut.yml'
jobs:
  sign:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify and sign
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS: $(sw_vers -productVersion)"
          echo "shortcuts executable: $(command -v shortcuts)"
          mkdir -p shortcut-builder/signed
          shopt -s nullglob
          files=(shortcut-builder/unsigned/*.shortcut)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No unsigned shortcuts found"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::Validate $(basename "$file")"
            file "$file"
            plutil -lint "$file"
            echo "::endgroup::"
            output="shortcut-builder/signed/$(basename "$file")"
            echo "::group::Sign original $(basename "$file")"
            if shortcuts sign --mode anyone --input "$file" --output "$output"; then
              echo "Signed XML plist successfully"
            else
              echo "::warning::Original XML sign failed, retrying with binary plist"
              binary_file="$(mktemp -d)/$(basename "$file")"
              plutil -convert binary1 -o "$binary_file" "$file"
              file "$binary_file"
              plutil -lint "$binary_file"
              shortcuts sign --mode anyone --input "$binary_file" --output "$output"
              rm -f "$binary_file"
            fi
            echo "::endgroup::"
            test -s "$output"
            file "$output"
            head -c 4 "$output" | od -An -tx1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-shortcut-smoke-test
          path: shortcut-builder/signed/*.shortcut
          if-no-files-found: error
